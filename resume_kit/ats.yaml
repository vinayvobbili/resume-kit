# Applicant-tracking-system quirks learned while filling real applications, plus
# JavaScript helpers for browser automation. Served by `resume ats <name>` and the
# ats_playbook MCP tool.

rules:
  - Stop before any Submit / Send button and get an explicit yes in chat.
  - The candidate signs in, creates accounts, accepts privacy/arbitration terms, and signs eSignatures.
  - Upload the tailored PDF built by `resume build <version>`, never an older file with a similar name.
  - Take cookie, SMS, marketing-email, and follow-the-company choices from the `defaults` section of answers.yaml.
  - Take a screenshot to confirm each page before moving on. Values set by script can look set without registering.

systems:
  greenhouse:
    hosts: [job-boards.greenhouse.io, boards.greenhouse.io]
    account: none needed
    job_api: https://boards-api.greenhouse.io/v1/boards/<board>/jobs/<id>?questions=true
    quirks:
      - Dropdowns are react-select comboboxes. Click the control, type the option text, then press Enter or click the option. Do not script ArrowDown loops (one opened the phone-country list instead).
      - The phone field has its own country picker; choose "United States +1".
      - Gender can be a multi-select that shows chips; confirm exactly one chip.
      - Plain text inputs accept the setNativeValue helper.
      - A confirmation page appears after submit; screenshot it.
  ashby:
    hosts: [jobs.ashbyhq.com]
    account: none needed
    job_api: https://api.ashbyhq.com/posting-api/job-board/<org>?includeCompensation=true
    quirks:
      - Upload the resume FIRST. Resume upload / autofill resets fields you already filled.
      - Yes/No button groups can look selected after a scripted click without registering. Use a real click (computer tool) and verify before submit.
      - Text fields set with setNativeValue can show the value but stay empty to the form; Submit then reports "Missing entry for required field". Type text with real keystrokes (click the field, then type) instead of scripting it.
      - The success page confirms submission. Some employers cap applications per period; check before applying to several roles.
  lever:
    hosts: [jobs.lever.co, jobs.eu.lever.co]
    account: none needed
    job_api: https://api.lever.co/v0/postings/<org>/<posting-id>
    quirks:
      - Upload the resume FIRST (name="resume"). Lever parses it and may prefill name, email, phone, and current company.
      - Full name is a single field. Links go in urls[LinkedIn], urls[GitHub], urls[Other], etc.
      - Employer questions are named cards[<uuid>][fieldN]. Run the listFields helper to map them; required ones are marked ✱.
      - The ?source= query parameter sets the application source. An employee referral is submitted by the employee from inside Lever, so get the referral in before applying directly.
      - EEO fields (eeo[gender], eeo[race], eeo[veteran]) are optional selects.
  taleo:
    hosts: ["*.taleo.net"]
    account: candidate signs in (often with a social login)
    steps: [Profile Upload, Attachments, About You, Education & Experience, Job Profile Questions, eSignature, Review & Submit]
    quirks:
      - Radio and checkbox clicks trigger a postback that reloads the page and clears file uploads. Answer radios first, upload last, then re-check that the upload is still there.
      - A session reload can open the page in a new tab and clear some fields. Re-read every field before Next.
      - Native <select> elements are set with setSelect (value + change event). Toggle checkboxes with .click(), never by setting .checked.
      - Qualification checklists are left unticked unless the candidate really has the skill.
      - The final page says "Process completed".
  workday:
    hosts: ["*.myworkdayjobs.com"]
    account: candidate signs in
    quirks:
      - Usually refuses a second application to the same requisition from the same account.
      - Candidate Home shows application status (e.g. "Under review", "No longer under consideration").
      - Offers Autofill with Resume / Apply Manually / Use My Last Application.
      - Use My Last Application copies the old resume file and role descriptions. Remove the old file, upload the
        new PDF, and replace each role description with the current version's bullets.
      - The copied work history can be partial. Enter every job from answers.yaml work_history, and fill
        Education (field of study too), Certifications, Languages, Skills and Websites; recruiters filter on them.
      - Get My Experience right in one visit. After going Back to it, using Add Another in Work Experience or
        Education drops the saved rows on the next save. If you must go back, add every row again as new, delete
        the old rows, and check the Review page lists them all.
      - Skills and other search lists only take real clicks on an option. Check that the list is open right
        before clicking it, since a click on a fixed position that misses can hit a Delete button underneath.
      - Find a dropdown by its question label, not its position. The header Settings button is a listbox too, and
        some questions only appear after an answer (an "at least 16" question shows when "at least 18" is No).
      - Dropdowns are buttons with aria-haspopup="listbox". Clicking a [role="option"] from script registers.
      - Veteran status lists "I am not a veteran" apart from "a veteran, just not a protected veteran"; pick the exact one.
  linkedin:
    hosts: [www.linkedin.com]
    account: candidate is signed in
    quirks:
      - Easy Apply has a "Follow <company>" checkbox, checked by default. Uncheck it.
      - Top-choice marks are limited (3 per month) and carry a short message; use them only when asked.
      - When there's no Easy Apply, the Apply button leads to the company ATS; use that system's notes.
  eightfold:
    hosts: ["*.eightfold.ai"]
    quirks:
      - The job description renders client-side. Read it with the page-text tool, not a plain HTTP fetch.
  icims:
    hosts: ["*.icims.com"]
    account: candidate creates an account or signs in (email, privacy consent, then a password or email code)
    quirks:
      - The form lives in a same-origin iframe ("iCIMS Content iFrame") that the accessibility tree doesn't expand. Reach fields with document.querySelector('iframe').contentDocument; loading the frame's URL as the top page just redirects back to the wrapper.
      - The resume input (PortalProfileFields.Resume_File) is inside that iframe, out of reach of a file-upload tool. The candidate clicks Replace Resume, then My Computer, and picks the file. Upload first, since parsing can overwrite profile fields, then re-read every field.
      - The candidate-profile page advances with its Update Profile button. Finish Later saves a partial application to come back to.
      - The Submit button on the employer-questions page can be the FINAL submit even when the step bar shows more steps. Treat it as the final submit and have the candidate press it.
      - Employer questions are plain selects with ids like Q39; set .value and dispatch a change event, then confirm the visible value.
  avature:
    hosts: ["*.avature.net"]
    account: candidate signs in (many employers host it on their own careers domain)
    steps: [Select your resume, Personal info, Job specific questions]
    quirks:
      - A second application prefills from the last one. Re-read every field. Work history can come back short (missing roles, a title cut off, a wrong end date).
      - In each work-history entry, "Is current position?" is a native select. The End date input only appears after it is set to No, so set the select, wait, then fill the date.
      - Dates are <input type=month> fields that take YYYY-MM through setNativeValue.
      - Add Another appends a blank entry at the end of its section. Fill the new entries in order.
      - The resume is a select of files stored from earlier applications plus "Upload a new file". Upload the tailored PDF to the file input and confirm the select shows "Upload a new file" with that name.
      - The skills chips come from earlier resumes; leave them unless one is wrong.
      - The Application Accuracy Statement checkbox is the candidate's attestation. They tick it, then Continue moves to the job-specific questions. Save as draft keeps a partial application.
  smartrecruiters:
    hosts: [jobs.smartrecruiters.com, careers.smartrecruiters.com]
    account: none needed (one-click "Easy apply" form)
    job_api: https://api.smartrecruiters.com/v1/companies/<company>/postings/<posting-id>
    steps: [Profile (personal info, experience, resume, message), Preliminary questions]
    quirks:
      - Every field sits in shadow DOM (spl-* components), so the accessibility tree and plain querySelector see almost nothing. Read fields with the shadowFields helper; fill them with real clicks and typing, since setNativeValue on these inputs throws "Illegal invocation".
      - The resume input is inside the SPL-DROPZONE shadow root; a file-upload tool doesn't register there, even after moving the input. The candidate clicks "Choose a file" in the Resume box and picks the tailored PDF. Uploading it parses the resume into the Experience and Education cards; check them.
      - Parsing sets City from the resume's location line (e.g. "Maple Falls"). Retype the candidate's own city. "Confirm your email" starts empty and is required.
      - The "Message to the Hiring Team" box is optional free text; keep a copy of what goes in it.
      - Preliminary questions mix Yes/No radios and searchable dropdowns. Click the dropdown, then click the option in the list that opens; take a screenshot before each pick, because the list's options move the fields below.
      - The posting's location is its hiring office with remote=true; "Remote, <city>, CALIFORNIA" alone doesn't mean remote only in that state. Look for a state limit in the posting text.
      - The last page has an electronic signature (name and today's date) and a privacy-notice declaration checkbox, both the candidate's. Submit is on that page.
  neogov:
    hosts: [www.governmentjobs.com, www.schooljobs.com]
    account: candidate signs in or signs up (Sign in with Google still sends an email-confirmation link the candidate clicks)
    job_page: https://www.schooljobs.com/careers/<agency>/jobs/<id>/<slug> (part-time and adjunct pools are listed under /careers/<agency>/transferjobs)
    steps: [Résumé import, Info, Work, Education, Additional, References, Attachments, Questions, Review, Certify]
    quirks:
      - Importing the resume fills Work and Education, badly. Expect a role with no title or dates and another section's text in its duties, titles cut off at an "&" or a line break, and characters dropped from PDF ligatures and symbols ("efficacy" became "efcacy", "cutting" became "cutng", "×" vanished). Re-enter every duty summary from `resume show <version>` and check each entry's title and dates.
      - Each card (contact, personal info, preferences, each job and school) has its own Edit and Save. Find Edit buttons by their text or aria-label and .click() them by script. A stale ref from the accessibility tree once clicked the header link instead and dropped out of the application to the agency's job list; reopen /apply and the saved cards are still there.
      - Dropdowns are hidden <select> elements behind a typeahead. Set them with the setSelect helper (value plus a change event); typing into the typeahead and pressing Enter picked the wrong country ("India" became "British Indian Ocean Territory"). Countries outside the US have a single state option, "International".
      - Education's start-month and end-month selects share one id (edu-education-select-start-month-dropdown); take the first and second match.
      - Certificates need an issue month/year AND an expiration month/year; Save fails silently without them. Take dates from answers.yaml `certifications`.
      - Text fields and radios accept the setNativeValue helper and a script .click(); confirm in the card's read-only view after Save.
      - The phone field rejects the "+1 (555) 555-0100" format the import writes; enter ten digits.
      - Minimum compensation is two optional numeric boxes ($ per year, $ per hour). Leave them empty for adjunct and part-time pools rather than using the full-time salary answers.
      - Agency questions end with attestations (application-requirements review, the "did you remember" checklist, an application-integrity notice). They are the candidate's to tick. Leaving the tab with them unanswered shows a "Mandatory information missing" dialog; choose Stay on this Page.
      - Many agencies want unofficial transcripts uploaded under Attachments ("Add supplemental attachment", type Transcript). Uploads that are password-protected are rejected, and that includes PDFs with only an owner password, which open without one, like university transcript downloads. Re-save without encryption first (`uv run --no-project --with pikepdf python -I -c "import pikepdf; p=pikepdf.open('in.pdf'); p.save('out.pdf')"`).
      - The session times out after a stretch with no activity (a warning banner appears first; click it to stay signed in). After a timeout, /apply goes to the sign-in page; saved cards survive, so have the candidate sign in again and reopen /apply. Fetch side documents such as transcripts before starting, or keep the tab active.
      - The resume import does not attach the file. Add it under Attachments with type "Resume".
      - Tabs open in order; a later tab's URL redirects back to the current one. Go forward with Next. Clicking a tab-list entry by ref can drop out to the job list, but a coordinate click on an earlier tab works.
      - '"Add ..." buttons (certificate, skills) sometimes ignore a script .click() after a reload; a real coordinate click opens the form, and its first field takes focus.'
      - Additional → Skills cards are a name, years and months of experience (both required) and a Beginner/Intermediate/Expert level. The import adds a "Typing speed / Data Entry" card, which has only WPM and keystrokes-per-hour fields. Leave it and add real skills with years taken from answers.yaml `experience_years` and `work_history`.

helpers:
  setNativeValue: |
    // React-controlled <input>/<textarea>: set the value so React's onChange fires.
    function setNativeValue(el, value) {
      const proto = el instanceof HTMLTextAreaElement ? HTMLTextAreaElement.prototype : HTMLInputElement.prototype;
      Object.getOwnPropertyDescriptor(proto, 'value').set.call(el, value);
      el.dispatchEvent(new Event('input', { bubbles: true }));
      el.dispatchEvent(new Event('change', { bubbles: true }));
      el.dispatchEvent(new Event('blur', { bubbles: true }));
    }
  setSelect: |
    // Native <select> (Taleo, Workday legacy): pick by visible text, then fire change.
    function setSelect(el, text) {
      const opt = [...el.options].find(o => o.text.trim() === text) || [...el.options].find(o => o.text.includes(text));
      if (!opt) return `no option matching ${text}: ${[...el.options].map(o => o.text.trim()).join(' | ')}`;
      el.value = opt.value;
      el.dispatchEvent(new Event('change', { bubbles: true }));
      return `set ${el.name || el.id} = ${opt.text.trim()}`;
    }
  listFields: |
    // Map an unfamiliar form before filling it: one line per field (radio/checkbox groups
    // collapsed), with its label, name, type, required flag, and the choices a select or group offers.
    (() => {
      // Visible text of a label or heading, leaving out any part that holds a control (a wrapping
      // <label> would otherwise include every option). innerText skips hidden status messages.
      const hasControl = n => n.nodeType === 1 && (n.matches('select, input, textarea') || n.querySelector('select, input, textarea'));
      const textOf = n => [...n.childNodes].filter(c => !hasControl(c)).map(c => c.nodeType === 1 ? c.innerText : c.textContent).join(' ');
      // A group's own <label>s name its options: use the nearest heading above the whole group.
      const heading = el => { for (let e = el.parentElement; e && e !== document.body; e = e.parentElement) {
        const h = e.querySelector(':scope > legend, :scope > [class*="label"]'); if (h && !h.contains(el)) return textOf(h); } };
      const labelOf = (el, group) => ((group ? heading(el) : el.labels?.[0] && textOf(el.labels[0]))
        || el.getAttribute('aria-label') || heading(el) || '').replace(/\s+/g, ' ').trim().slice(0, 100);
      const seen = new Map();
      for (const el of document.querySelectorAll('input, select, textarea')) {
        if (el.type === 'hidden' || el.type === 'submit') continue;
        const group = el.type === 'radio' || el.type === 'checkbox';
        const key = group ? `${el.type}:${el.name}` : el;
        if (group && seen.has(key)) { seen.get(key).choices.push(el.value); continue; }
        seen.set(key, { name: el.name || el.id, type: el.tagName === 'SELECT' ? 'select' : el.type,
          required: el.required || el.getAttribute('aria-required') === 'true', label: labelOf(el, group),
          choices: el.tagName === 'SELECT' ? [...el.options].map(o => o.text.trim()).filter(Boolean)
                 : group ? [el.value] : [] });
      }
      return [...seen.values()].map(f => `${f.required ? '*' : ' '} ${f.name} [${f.type}] ${f.label}`
        + (f.choices.length ? `  {${f.choices.join(' | ').slice(0, 200)}}` : '')).join('\n');
    })()
  emptyRequired: |
    // List required fields that are still empty, so nothing is missed before Next/Submit.
    [...document.querySelectorAll('input, select, textarea')]
      .filter(el => (el.required || el.getAttribute('aria-required') === 'true') && el.type !== 'hidden')
      .filter(el => (el.type === 'radio' || el.type === 'checkbox')
        ? !document.querySelector(`input[name="${CSS.escape(el.name)}"]:checked`)
        : !el.value)
      .map(el => `${el.tagName.toLowerCase()} ${el.name || el.id} (${el.labels?.[0]?.innerText.trim() || el.getAttribute('aria-label') || ''})`);
  shadowFields: |
    // Forms built from web components (SmartRecruiters): list every input, textarea and select,
    // inside shadow roots too, with its id (or label) and current value; file inputs show the file name.
    (() => {
      const out = [];
      const walk = root => root.querySelectorAll('*').forEach(el => {
        if (el.shadowRoot) walk(el.shadowRoot);
        if (!['INPUT', 'TEXTAREA', 'SELECT'].includes(el.tagName) || el.type === 'hidden') return;
        const name = el.id || el.name || el.getAttribute('aria-label') || el.placeholder || '';
        const value = el.type === 'file' ? ([...(el.files || [])].map(f => f.name).join(', ') || '(empty)')
          : (el.type === 'radio' || el.type === 'checkbox') ? (el.checked ? 'checked' : 'unchecked') : el.value;
        out.push(`${el.tagName.toLowerCase()} ${el.type || ''} ${name}: ${String(value).slice(0, 80)}`);
      });
      walk(document);
      return out.join('\n');
    })()
  fileInputs: |
    // Where the resume goes: list file inputs and what (if anything) is attached.
    [...document.querySelectorAll('input[type=file]')].map(el => `${el.name || el.id}: ${[...el.files].map(f => f.name).join(', ') || '(empty)'}`);
